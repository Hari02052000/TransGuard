paths:
  /risk/rules:
    get:
      tags: [Risk]
      summary: Get all risk rules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of risk rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskRule'
        '401':
          $ref: '../openapi.yaml#/components/responses/UnauthorizedError'

  /risk/evaluate/{transactionId}:
    post:
      tags: [Risk]
      summary: Evaluate transaction risk
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Risk evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEvaluationResponse'
        '401':
          $ref: '../openapi.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFoundError'

  /risk/transactions/{transactionId}:
    get:
      tags: [Risk]
      summary: Get transaction risk score
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Risk score retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEvaluationResponse'
        '401':
          $ref: '../openapi.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFoundError'

components:
  schemas:
    RiskRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        weight:
          type: number
        isActive:
          type: boolean
      required:
        - id
        - name
        - weight
        - isActive

    RiskEvaluationResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        riskScore:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high]
        evaluatedAt:
          type: string
          format: date-time
      required:
        - transactionId
        - riskScore
        - riskLevel
        - evaluatedAt