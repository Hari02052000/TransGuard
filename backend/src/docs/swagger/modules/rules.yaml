paths:

  /rules:
    get:
      tags: [Rules]
      summary: List rules
      description: Retrieve all configured risk rules.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: active
          schema:
            type: boolean
          description: Filter active rules
        - in: query
          name: type
          schema:
            type: string
            enum: [amount, location, device, velocity]
      responses:
        '200':
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
        '401':
          $ref: '../openapi.yaml#/components/responses/UnauthorizedError'

    post:
      tags: [Rules]
      summary: Create rule
      description: Create a new fraud detection rule.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'


  /rules/{id}:
    get:
      tags: [Rules]
      summary: Get rule details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFoundError'

    patch:
      tags: [Rules]
      summary: Update rule
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleRequest'
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'

    delete:
      tags: [Rules]
      summary: Delete rule
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Rule deleted


  /rules/{id}/toggle:
    patch:
      tags: [Rules]
      summary: Enable or disable rule
      description: Toggle rule active status.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleRuleRequest'
      responses:
        '200':
          description: Rule status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'


components:
  schemas:

    Rule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [amount, location, device, velocity]
        condition:
          type: string
          example: "amount > 10000"
        weight:
          type: number
          example: 40
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - condition
        - weight
        - isActive

    CreateRuleRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [amount, location, device, velocity]
        condition:
          type: string
        weight:
          type: number
      required:
        - name
        - type
        - condition
        - weight

    UpdateRuleRequest:
      type: object
      properties:
        name:
          type: string
        condition:
          type: string
        weight:
          type: number

    ToggleRuleRequest:
      type: object
      properties:
        isActive:
          type: boolean
      required:
        - isActive