paths:

  /alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      description: Retrieve alerts with optional filters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, under_review, resolved, dismissed]
        - in: query
          name: riskLevel
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        '200':
          description: Alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '401':
          $ref: '../openapi.yaml#/components/responses/UnauthorizedError'

    post:
      tags: [Alerts]
      summary: Create alert
      description: Internal route used by risk engine to create alerts.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'


  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: Get alert details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Alert details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFoundError'


  /alerts/{id}/status:
    patch:
      tags: [Alerts]
      summary: Update alert status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'


  /alerts/{id}/assign:
    patch:
      tags: [Alerts]
      summary: Assign alert to analyst
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignAlertRequest'
      responses:
        '200':
          description: Alert assigned


  /alerts/{id}/notes:
    post:
      tags: [Alerts]
      summary: Add investigation note
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Note added

    get:
      tags: [Alerts]
      summary: Get alert notes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notes list


  /alerts/transaction/{transactionId}:
    get:
      tags: [Alerts]
      summary: Alerts for a transaction
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'


  /alerts/stats:
    get:
      tags: [Alerts]
      summary: Alerts dashboard statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alert statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStats'


components:
  schemas:

    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        riskScore:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [open, under_review, resolved, dismissed]
        assignedTo:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateAlertRequest:
      type: object
      properties:
        transactionId:
          type: string
        riskScore:
          type: number
        riskLevel:
          type: string
      required:
        - transactionId
        - riskScore
        - riskLevel

    UpdateAlertStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [under_review, resolved, dismissed]

    AssignAlertRequest:
      type: object
      properties:
        analystId:
          type: string

    CreateNoteRequest:
      type: object
      properties:
        note:
          type: string
      required:
        - note

    AlertStats:
      type: object
      properties:
        openAlerts:
          type: integer
        underReview:
          type: integer
        resolved:
          type: integer